name: CI
on:
  push:
    branches: [ci]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-format-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Run lint
        run: pnpm lint:mobile
      - name: Run format check
        run: pnpm format:check-mobile

  lint-format-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Run lint
        run: pnpm lint:web
      - name: Run format check
        run: pnpm format:check-web

  build-android:
    needs: lint-format-mobile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install dependencies
        run: sed -i 's/# //g' pnpm-workspace.yaml && pnpm install
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Add keys
        env:
          GOOGLE_MAPS_SDK_API_KEY: ${{ secrets.GOOGLE_MAPS_SDK_API_KEY }}
        run: echo "GOOGLE_MAPS_SDK_API_KEY=blahblahblahblahasdfasdf" >> apps/mobile/android/local.properties
      - name: Add google-services.json
        #        env:
        #          GOOGLE_SERVICES_JSON_FILE: ${{ secrets.GOOGLE_SERVICES_JSON }}
        #         run: echo $GOOGLE_SERVICES_JSON_FILE | base64 --decode > apps/mobile/android/app/google-services.json
        run: cp apps/mobile/android/app/google-services.json.template apps/mobile/android/app/google-services.json
      - name: Grant execute permission for gradlew
        run: chmod +x apps/mobile/android/gradlew
      - name: Build debug APK
        run: cd apps/mobile/android && ./gradlew assembleDebug

  build-ios:
    needs: lint-format-mobile
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - name: Install dependencies
        run: pnpm install
      - name: Install dependencies
        run: |
          cd apps/mobile/ios && bundle install && bundle exec pod install --repo-update
      - name: Build iOS app (debug)
        run: |
          cd apps/mobile/ios && xcodebuild build -workspace SureWalk.xcworkspace \
            -scheme SureWalk \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGN_STYLE="Automatic"

  build-web:
    needs: lint-format-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install
      - name: Build web app
        run: cd apps/web && pnpm opennextjs-cloudflare build
